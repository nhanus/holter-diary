version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    # Node type definitions must follow the runtime major in .node-version.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
