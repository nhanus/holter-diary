name: Publish to Pages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    # The caller owns the queue through validation, release and deployment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Download the build validated in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: holter-website-${{ github.sha }}
          path: dist
      - name: Package the website and selected app
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
          include-hidden-files: true
      - name: Check that this is still the current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ENABLED: ${{ vars.PAGES_ENABLED }}
        run: node scripts/check-pages-deployment.mjs
      - name: Deploy the validated artifact
        if: steps.current.outputs.eligible == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
