name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the tested npm toolchain
        run: npm install --global npm@12.2.2 --ignore-scripts --no-fund
      - name: Test dependency policy without installing packages
        run: node --test tests/policy/*.test.mjs
      - name: Test release identity and publication guards
        run: node --test tests/release/*.test.mjs
      - name: Check all locked release ages before installation
        run: node scripts/check-dependency-policy.mjs
      - name: Check known vulnerabilities including development dependencies
        run: npm audit --package-lock-only --audit-level=low
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run check
      - name: Test time, storage permissions and PDF output
        run: npm run test:unit
      - name: Build static app
        run: npm run build
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Test browser storage
        run: npm run test:browser
      - name: Test complete offline app
        run: npm run test:app
      - name: Test website and app separation
        run: npm run test:site
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failures-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package the tested app for release
        run: node scripts/release.mjs prepare
      - name: Retain release package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: holter-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: Retain build for inspection
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: holter-diary-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish a new version
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Download the exact package from the successful build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: holter-release-${{ github.sha }}
          path: release
      - name: Publish without rebuilding or replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish

  website:
    name: Assemble website with published app
    needs: [build, release]
    if: always() && needs.build.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Copy the selected published app without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/select-app-release.mjs
      - name: Retain complete hosting snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: holter-website-${{ github.sha }}
          path: site-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
