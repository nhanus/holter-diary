name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Queue the complete pipeline before building, so a faster later build cannot
# overtake a pipeline that already entered this queue. GitHub limits it to 100.
concurrency:
  group: main-release
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and publish
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publish website
    needs: validate
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
